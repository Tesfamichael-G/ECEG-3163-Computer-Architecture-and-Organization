site_name: ECEG-4192 — Data Structures
site_description: BSc Electrical Engineering (Computer) · Semester VII · Module Data Storage and Analysis
site_author: Your Name
site_url: https://tesfamichael-g.github.io/ECEG-3163-Computer-Architecture-and-Organization/
repo_name: YOUR-USERNAME/ECEG-4192

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/file-tree
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Schedule: schedule.md
  - Chapters:
      - 1. Introduction and Performance: chapters/01-introduction-performance.md
      - 2. Computer Arithmetic: chapters/02-computer-arithmetic.md
      - 3. Instruction Sets: chapters/03-instruction-sets.md
      - 4. Pipelining and Control: chapters/04-pipelining-control.md
      - 5. Memory Systems: chapters/05-memory-systems.md
      - 6. I/O Systems: chapters/06-io-systems.md
      - 7. Advanced Topics: chapters/07-advanced-topics.md
  - Slides:
      - 1. Introduction and Performance: slides/01-introduction-performance.md
      - 2. Computer Arithmetic: slides/02-computer-arithmetic.md
      - 3. Instruction Sets: slides/03-instruction-sets.md
      - 4. Pipelining and Control: slides/04-pipelining-control.md
      - 5. Memory Systems: slides/05-memory-systems.md
      - 6. I/O Systems: slides/06-io-systems.md
      - 7. Advanced Topics: slides/07-advanced-topics.md
  - Solutions:
      - Overview: solutions/index.md
      - 1. Introduction and Performance: solutions/01-introduction-performance.md
      - 2. Computer Arithmetic: solutions/02-computer-arithmetic.md
      - 3. Instruction Sets: solutions/03-instruction-sets.md
      - 4. Pipelining and Control: solutions/04-pipelining-control.md
      - 5. Memory Systems: solutions/05-memory-systems.md
      - 6. I/O Systems: solutions/06-io-systems.md
      - 7. Advanced Topics: solutions/07-advanced-topics.md
  - Exam Bank: exam-bank.md
  - Assessment: assessment.md
  - Resources: resources.md
  - Feedback: feedback.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['dollar', 'round']
      block_syntax: ['dollar', 'square']
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js